<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Night is the default theme, so `data-theme` is in the markup rather than
      written by script: the first frame is already the right colour and there
      is no flash to correct. `color-scheme` stops Chrome painting its own white
      canvas behind the document before our stylesheet applies.
    -->
    <meta name="color-scheme" content="dark light" />
    <title>New Tab</title>
    <link rel="stylesheet" href="../styles/global.css" />
  </head>
  <body>
    <div id="deck-root" data-deck="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
